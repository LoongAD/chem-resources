<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线小测｜化学教学资料站</title>
<meta name="description" content="初三化学在线小测：4 套单元自测，即时判分，逐题解析。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23b11226'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>化</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="app-topbar">
  <a class="back" href="index.html">← 资料站</a>
  <span class="wordmark">龙老师 · 化学资料站</span>
</header>

<main class="app-canvas">
  <!-- 列表 -->
  <section id="view-list">
    <h1 class="app-title">在线小测</h1>
    <p class="app-sub" id="quiz-sub"></p>
    <div class="qz-list" id="quiz-list"></div>
  </section>

  <!-- 答题 -->
  <section id="view-quiz" hidden>
    <div class="q-head">
      <h2 id="quiz-title"></h2>
      <span class="q-progress" id="quiz-progress"></span>
    </div>
    <div id="questions"></div>
    <div class="q-actions">
      <button class="btn-accent btn-lg" id="btn-submit" type="button">交卷判分</button>
    </div>
    <p style="text-align:center"><button class="btn-ghost" id="btn-back-list" type="button">← 返回列表</button></p>
  </section>

  <!-- 成绩 -->
  <section id="view-result" hidden>
    <div class="score-hero">
      <div class="score num" id="score-num"></div>
      <p class="score-sub" id="score-sub"></p>
    </div>
    <div id="review"></div>
    <div class="q-actions">
      <button class="btn-accent btn-lg" id="btn-retry" type="button">再测一次</button>
    </div>
    <p style="text-align:center"><button class="btn-ghost" id="btn-back-list2" type="button">← 返回列表</button></p>
  </section>
</main>

<script src="data/quiz.js"></script>
<script src="assets/quiz.js"></script>
</body>
</html>
