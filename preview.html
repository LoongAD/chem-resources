<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线预览</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23b11226'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>化</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="preview-page">

<header class="preview-bar">
  <div class="preview-bar-inner">
    <a class="back-btn" href="index.html">← 返回资料站</a>
    <h1 id="doc-title">正在加载…</h1>
    <a class="open-new" id="open-new" href="#" target="_blank" rel="noopener">新窗口打开</a>
  </div>
</header>

<main class="preview-main">
  <div class="preview-loading" id="loading">正在加载预览，请稍候…</div>
  <iframe id="viewer" title="文档在线预览"></iframe>
</main>

<script>
(function () {
  'use strict';
  var q = new URLSearchParams(window.location.search);
  var src = q.get('src') || '';
  var title = q.get('title') || '文档预览';
  document.title = title + ' - 在线预览';
  document.getElementById('doc-title').textContent = title;
  var loading = document.getElementById('loading');
  if (!src) {
    loading.textContent = '缺少文件参数，请从资料站进入。';
    return;
  }
  var absUrl = new URL(src, window.location.href).href;
  // PDF 浏览器可直接渲染；Word 文档走 Office 在线预览服务
  var viewerUrl = /\.pdf$/i.test(src)
    ? absUrl
    : 'https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(absUrl);
  document.getElementById('open-new').href = viewerUrl;
  var frame = document.getElementById('viewer');
  frame.addEventListener('load', function () { loading.style.display = 'none'; });
  frame.src = viewerUrl;
  setTimeout(function () {
    if (loading.style.display !== 'none') {
      loading.textContent = '加载较慢，请耐心等待，也可以点右上角“新窗口打开”。';
    }
  }, 15000);
})();
</script>
</body>
</html>
