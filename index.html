<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学教学资料站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true">⚗️</div>
      <div>
        <h1 id="site-title">化学教学资料站</h1>
        <p class="subtitle" id="site-subtitle"></p>
      </div>
    </div>
    <div class="search-box">
      <input id="search" type="search" placeholder="搜索资料标题、关键词…" autocomplete="off">
    </div>
  </div>
</header>

<nav class="container tabs" id="tabs" aria-label="资料分类"></nav>

<main class="container">
  <p class="result-count" id="count"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <p>没有找到相关资料，换个关键词试试。</p>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <span id="footer-text"></span>
  </div>
</footer>

<script src="data/resources.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
